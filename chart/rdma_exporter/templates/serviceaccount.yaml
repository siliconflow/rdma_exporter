{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rdma_exporter.serviceAccountName" . }}
  namespace: {{ include "rdma_exporter.namespace" . }}
  labels:
    {{- include "rdma_exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
